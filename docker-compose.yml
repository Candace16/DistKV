version: '3.8'

services:
  node1:
    build: .
    container_name: distkv-node1
    command: ["--port", "7000", "--id", "node1", "--peers", "node2:node2:7001,node3:node3:7002", "--data-dir", "/data", "--fsync", "everysec"]
    ports:
      - "7000:7000"
    volumes:
      - node1_data:/data
    networks:
      - distkv-net

  node2:
    build: .
    container_name: distkv-node2
    command: ["--port", "7001", "--id", "node2", "--peers", "node1:node1:7000,node3:node3:7002", "--data-dir", "/data", "--fsync", "everysec"]
    ports:
      - "7001:7001"
    volumes:
      - node2_data:/data
    networks:
      - distkv-net

  node3:
    build: .
    container_name: distkv-node3
    command: ["--port", "7002", "--id", "node3", "--peers", "node1:node1:7000,node2:node2:7001", "--data-dir", "/data", "--fsync", "everysec"]
    ports:
      - "7002:7002"
    volumes:
      - node3_data:/data
    networks:
      - distkv-net

volumes:
  node1_data:
  node2_data:
  node3_data:

networks:
  distkv-net:
    driver: bridge
